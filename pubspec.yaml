name: abbk_pfe
description: "ABBK PFE - Admin Concepteurs Communication System"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & Providers
  provider: ^6.0.0
  
  # Firebase
  firebase_core: ^2.24.0
  cloud_firestore: ^4.13.0
  firebase_storage: ^11.5.0
  firebase_auth: ^4.14.0
  
  # Agora for Real-time Communication
  agora_uikit: ^1.3.0
  agora_rtc_engine: ^6.2.0
  
  # Audio
  audioplayers: ^5.0.0
  record: ^4.4.4
  
  # File Handling
  file_picker: ^5.3.4
  path_provider: ^2.1.0
  
  # UI
  cupertino_icons: ^1.0.2
  
  # Environment & Config
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  # Assets for ringtone
  assets:
    - assets/sounds/
    - .env
